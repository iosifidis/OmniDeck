<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - OmniDeck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{{if .User.DarkMode}}dark-mode{{end}} bg-light">

    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white shadow-sm mb-5">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary fs-5">OD</span>
            <span class="h5 m-0 fw-bold text-dark">OmniDeck</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted me-2">Hello, <strong>{{.User.Username}}</strong></span>
            <a href="/" class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Logout</a>
        </div>
    </header>

    <!-- PROFILE CARD -->
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="m-0 text-primary">Edit Profile</h4>
            </div>
            <div class="card-body p-4">
                <form action="/profile" method="POST">
                    
                    <!-- Username -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" value="{{.User.Username}}" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">New Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
                    </div>

                    <!-- Dark Mode Switch -->
                    <div class="mb-4 p-3 bg-light rounded border d-flex align-items-center justify-content-between">
                        <label class="form-check-label fw-bold mb-0" for="darkModeSwitch">Dark Mode Theme</label>
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch" name="dark_mode" style="width: 50px; height: 25px;" {{if .User.DarkMode}}checked{{end}}>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Buttons -->
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="/" class="btn btn-danger d-flex align-items-center justify-content-center" style="width: 100px;">Cancel</a>
                        <button type="submit" class="btn btn-primary d-flex align-items-center justify-content-center" style="width: 100px;">Save</button>
                    </div>
                </form>

                <!-- DANGER ZONE -->
                <hr class="my-4">
                
                <div class="border border-danger rounded-3 p-4 bg-danger bg-opacity-10">
                    <h5 class="text-danger fw-bold mb-3">⚠️ Danger Zone</h5>
                    <p class="text-muted mb-3">
                        Clear all collected data (Posts & Authors). Sites and settings will remain intact.
                    </p>
                    <form action="/reset-data" method="POST" onsubmit="return confirm('WARNING: Are you sure you want to delete ALL collected data? This cannot be undone.');">
                        <button type="submit" class="btn btn-outline-danger fw-bold">
                            🗑️ Clear Database
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
