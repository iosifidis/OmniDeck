<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OmniDeck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <!-- Logo & Title -->
            <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
                <span class="badge bg-primary fs-4">OD</span>
                <h3 class="fw-bold m-0 text-dark">OmniDeck</h3>
            </div>

            <!-- Error Message -->
            {{if .Error}}
            <div class="alert alert-danger text-center p-2 small mb-3">
                {{.Error}}
            </div>
            {{end}}

            <!-- Login Form -->
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
