<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sites - OmniDeck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="{{if .User.DarkMode}}dark-mode{{end}} bg-light">

    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white shadow-sm mb-4">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary fs-5">OD</span>
            <span class="h5 m-0 fw-bold text-dark">OmniDeck</span>
        </div>
        <div class="user-area d-flex align-items-center gap-2">
            <span class="text-muted me-2">Hello, <strong>{{.User.Username}}</strong></span>
            <a href="/" class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Logout</a>
        </div>
    </header>

    <div class="container mb-5">
        <div class="row">
            
            <!-- ADD SITE CARD -->
            <div class="col-12 mb-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="m-0 text-primary fw-bold">Add New Site</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/settings" method="POST">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small text-muted">Site Name</label>
                                    <input type="text" name="name" class="form-control" placeholder="e.g. My Tech Blog" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold small text-muted">WordPress URL</label>
                                    <input type="url" name="url" class="form-control" placeholder="https://example.com" required>
                                </div>
                                <div class="col-md-3 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Add & Sync</button>
                                    <a href="/" class="btn btn-danger w-100 fw-bold">Cancel</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- LIST OF SITES -->
            <div class="col-12">
                <h5 class="mb-3 text-muted fw-bold">Monitored Sites</h5>
                <div class="row g-3">
                    {{range .Sites}}
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0 rounded-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title fw-bold m-0 text-dark">{{.Name}}</h5>
                                    {{if eq .Status "UP"}}
                                    <span class="badge bg-success bg-opacity-10 text-success border border-success rounded-pill px-3">UP</span>
                                    {{else}}
                                    <span class="badge bg-danger bg-opacity-10 text-danger border border-danger rounded-pill px-3">DOWN</span>
                                    {{end}}
                                </div>
                                
                                <a href="{{.URL}}" target="_blank" class="text-decoration-none small text-primary mb-3 d-block text-truncate">{{.URL}}</a>
                                
                                <div class="d-flex align-items-center text-muted small mb-4">
                                    <span class="me-1">🕒</span>
                                    <span>Last Checked: {{.LastChecked.Format "02/01 15:04"}}</span>
                                </div>

                                <div class="d-flex gap-2">
                                    <a href="/site/edit?id={{.ID}}" class="btn btn-sm btn-outline-warning text-dark flex-grow-1 fw-bold">Edit</a>
                                    <form action="/site/delete?id={{.ID}}" method="POST" class="flex-grow-1" onsubmit="return confirm('Delete this site and all its posts?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger w-100 fw-bold">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    {{else}}
                    <div class="col-12">
                        <div class="alert alert-info text-center">No sites added yet. Add one above!</div>
                    </div>
                    {{end}}
                </div>
            </div>

        </div>
    </div>

</body>
</html>
