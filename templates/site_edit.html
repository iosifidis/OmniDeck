<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Site - OmniDeck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="{{if .User.DarkMode}}dark-mode{{end}} bg-light">

    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white shadow-sm mb-5">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary fs-5">OD</span>
            <span class="h5 m-0 fw-bold text-dark">OmniDeck</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted me-2">Hello, <strong>{{.User.Username}}</strong></span>
            <a href="/" class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm d-flex align-items-center justify-content-center" style="height: 34px; padding: 0 15px;">Logout</a>
        </div>
    </header>

    <!-- EDIT CARD -->
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h4 class="m-0 text-primary">Edit Site</h4>
            </div>
            <div class="card-body p-4">
                <form action="/site/edit?id={{.Site.ID}}" method="POST">
                    
                    <!-- Site Name -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Site Name</label>
                        <input type="text" name="name" class="form-control" value="{{.Site.Name}}" required>
                    </div>

                    <!-- Site URL -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">WordPress URL</label>
                        <input type="url" name="url" class="form-control" value="{{.Site.URL}}" required>
                    </div>

                    <hr class="my-4">

                    <!-- Buttons -->
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="/settings" class="btn btn-danger d-flex align-items-center justify-content-center" style="width: 100px;">Cancel</a>
                        <button type="submit" class="btn btn-primary d-flex align-items-center justify-content-center" style="width: 140px;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
