<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Edit Site</title>
</head>
<body class="{{if .User}}{{if .User.DarkMode}}dark-mode{{end}}{{end}}">
<header class="d-flex justify-content-between align-items-center p-3 border-bottom bg-white shadow-sm">
    <div class="d-flex align-items-center gap-2">
        <a href="/" class="d-flex align-items-center gap-2 text-decoration-none text-dark">
            <span class="badge bg-primary">OD</span>
            <span class="h5 m-0 fw-bold">OmniDeck</span>
        </a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-muted">Hello, <strong>{{.User.Username}}</strong></span>
        <a href="/profile" class="btn btn-primary btn-sm">Profile</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</header>
<main>
  <div class="cards">
    <div class="card form-card">
      <h3>Edit Site</h3>
      <form method="POST" action="/site/edit?id={{.Site.ID}}">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" value="{{.Site.Name}}" required>
        </div>
        <div class="field">
          <label for="url">URL</label>
          <input type="url" id="url" name="url" value="{{.Site.URL}}" required>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
